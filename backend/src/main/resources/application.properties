spring.application.name=backend


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Multipart limits for database backup restore uploads
spring.servlet.multipart.max-file-size=${BACKUP_RESTORE_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${BACKUP_RESTORE_MAX_REQUEST_SIZE:101MB}
# Maximum total uncompressed ZIP content in bytes (200 MiB by default)
app.backup.max-uncompressed-size=${BACKUP_RESTORE_MAX_UNCOMPRESSED_SIZE:209715200}
app.backup.b2.endpoint=${B2_ENDPOINT:}
app.backup.b2.region=${B2_REGION:us-west-004}
app.backup.b2.bucket=${B2_BUCKET:}
app.backup.b2.key-id=${B2_KEY_ID:}
app.backup.b2.application-key=${B2_APPLICATION_KEY:}
app.backup.schedule.enabled=${BACKUP_AUTO_ENABLED:true}
app.backup.schedule.cron=${BACKUP_AUTO_CRON:0 0 2 * * *}
app.backup.schedule.zone=${BACKUP_AUTO_ZONE:Asia/Ho_Chi_Minh}
app.backup.schedule.retention-days=${BACKUP_AUTO_RETENTION_DAYS:30}

# Cau hinh cho MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cau hinh Cloudinary
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}


jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS: danh sách origin được phép (phân tách bằng dấu phẩy)
# Dev: http://localhost:5173 | Prod: https://qlpkweb.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://qlpkweb.vercel.app,https://qlpk-tamdg.vercel.app}

vnpay.tmn-code=${VNP_TMN_CODE}
vnpay.hash-secret=${VNP_HASH_SECRET}
vnpay.tmn-code-pro=${VNP_TMN_CODE_PRO:}
vnpay.hash-secret-pro=${VNP_HASH_SECRET_PRO:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=https://qlpk-backend-spring-boot.onrender.com/api/payment/vnpay/return

# Frontend base URL để redirect sau khi thanh toán
# Dev: http://localhost:5173 | Prod: https://qlpk-tamdg.vercel.app
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.frontend.url.prod=${FRONTEND_URL_PRO:https://qlpk-tamdg.vercel.app}

# Firebase Configuration (da cau hinh firebase-service-account.json)
firebase.enabled=true
firebase.config.file=classpath:firebase-service-account.json

# Secret bảo vệ endpoint nội bộ cron-job.org (POST /api/internal/notifications/process)
internal.notification.secret=${INTERNAL_NOTIFICATION_SECRET}

# Brevo Transactional Email API
brevo.api.url=${BREVO_API_URL}
brevo.api.key=${BREVO_API_KEY}

# Mật khẩu mặc định khi Admin tạo tài khoản nhân viên mới
app.default-employee-password=${DEFAULT_EMP_PASSWORD:12345}
