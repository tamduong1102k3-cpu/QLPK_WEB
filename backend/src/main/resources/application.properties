spring.application.name=backend


spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Cau hinh cho MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cau hinh Cloudinary
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}


jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# CORS: danh sách origin được phép (phân tách bằng dấu phẩy)
# Dev: http://localhost:5173 | Prod: https://qlpkweb.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://qlpk-tamdg.vercel.app}

vnpay.tmn-code=${VNP_TMN_CODE}
vnpay.hash-secret=${VNP_HASH_SECRET}
vnpay.tmn-code-pro=${VNP_TMN_CODE_PRO:}
vnpay.hash-secret-pro=${VNP_HASH_SECRET_PRO:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=https://qlpk-backend-spring-boot.onrender.com/api/payment/vnpay/return

# Frontend base URL để redirect sau khi thanh toán
# Dev: http://localhost:5173 | Prod: https://qlpk-tamdg.vercel.app
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.frontend.url.prod=${FRONTEND_URL_PRO:https://qlpk-tamdg.vercel.app}

# Firebase Configuration (da cau hinh firebase-service-account.json)
firebase.enabled=true
firebase.config.file=classpath:firebase-service-account.json

# Secret bảo vệ endpoint nội bộ cron-job.org (POST /api/internal/notifications/process)
internal.notification.secret=${INTERNAL_NOTIFICATION_SECRET}

# Brevo Transactional Email API
brevo.api.url=${BREVO_API_URL}
brevo.api.key=${BREVO_API_KEY}

# Mật khẩu mặc định khi Admin tạo tài khoản nhân viên mới
app.default-employee-password=${DEFAULT_EMP_PASSWORD:12345}
